name: source
description: >
  Puts the commit of Phreox/phreox that is built (and all its submodules) into ./phreox. The repository of the workflows has Phreox/phreox as a submodule of its own, but
  the commit that is built is the one that was pushed, not the one the pointer shows, so the submodule is moved to it.
inputs:
  sha:
    description: The commit of Phreox/phreox.
    required: true
  token:
    description: A token that can read Phreox/phreox and its submodules (they are private).
    required: true
  frontend-branch:
    description: >
      A branch of the frontend repository (phreox-frontend) to build instead of the commit the pointer shows. The pointer shows the Rust app; the
      jobs that build the React app (web, Android, desktop) ask for react-legacy.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SHA: ${{ inputs.sha }}
        TOKEN: ${{ inputs.token }}
        FRONTEND_BRANCH: ${{ inputs.frontend-branch }}
      run: |
        if [[ -z "$TOKEN" ]]; then
          echo "::error::The secret SUBMODULES_TOKEN is not set in this repository. Phreox/phreox and its submodules are private: make a fine-grained token with 'Contents: read' on all of them (Phreox/phreox, docs, api, app, backend, frontend, presence, server-common, service, space, watchtogether) and add it under Settings > Secrets and variables > Actions."
          exit 1
        fi

        # Every repository of Phreox is read with the token, the submodules of the submodules too.
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        git submodule update --init phreox
        git -C phreox fetch --no-tags origin "$SHA"
        git -C phreox checkout --force "$SHA"
        git -C phreox submodule update --init --recursive

        if [[ -n "$FRONTEND_BRANCH" ]]; then
          git -C phreox/phreox-frontend fetch --no-tags origin "$FRONTEND_BRANCH"
          git -C phreox/phreox-frontend checkout --force FETCH_HEAD
          echo "phreox-frontend: branch $FRONTEND_BRANCH, $(git -C phreox/phreox-frontend log --oneline -1)"
        fi

        git -C phreox log --oneline -1
