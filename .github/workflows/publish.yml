# Builds every channel of the apps and puts them into one release of https://github.com/Phreox/releases.
#
#   push of the main branch   ->  pre-release 1.0.0-dev.<8 chars of the commit>, channel dev; only one dev release exists at a time
#   tag 1.2.3                 ->  normal release, channel release (the stable app)
#   tag 1.2.3-beta.N / -pre.N / -rc.N       ->  pre-release, channel beta
#   tag 1.2.3-alpha.N / -pre.alpha.N        ->  pre-release, channel alpha
#
# The push happens in Phreox/phreox, whose workflow `dispatch` starts this one (workflow_dispatch, with the branch or tag and the commit); this repository has Phreox/phreox as a submodule
# (./phreox) and builds the commit it was told about. Run by hand (Actions > publish > Run workflow) it builds the branch or tag you name.
#
# NO ARTIFACTS: nothing built is kept in the run. The release is made as a DRAFT first and every job puts its files straight into it (scripts/release.sh). The draft is
# published as soon as the quick parts are in it (service, backend, space node, web); the Android app and the desktop apps (AppImage, exe, dmg) are added to the release one after
# the other when they are done, and SHA256SUMS is written again each time. The apps look at the release for the file of their system, so one that is not there yet is simply not offered yet.
# What one job needs of another (the libopus and PortAudio builds) is in a second draft that nobody sees and that is thrown away at the end, so the release has nothing but its files.
# A run that fails or is cancelled throws its drafts away.
#
# Each channel is an app of its own (own id, name and data). Release, beta and alpha talk to the real services so their accounts are the same; dev has services of its own.
# See phreox/phreox-app/channels.json and phreox/docs/RELEASES.md.
#
# The service, the backend and the web version are in the release too, as phreox-service-*.jar, phreox-backend-*.jar and phreox-web-*.tar.gz: the Pterodactyl eggs install and
# update themselves from them. A failure of the Android or desktop build does not hold the release back, it only misses the file.
#
# Secrets of this repository: RELEASES_TOKEN (write access to the contents of Phreox/releases), SUBMODULES_TOKEN (read access to Phreox/phreox and its submodules),
# UPDATE_TOKEN (the token the apps use to ask for updates), ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS (the key every Android build is signed with).
name: publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag of Phreox/phreox to build (a tag like 1.2.3 makes a release, a branch a dev release)"
        required: true
        default: master
      ref_type:
        description: "Is it a branch or a tag (the workflow of Phreox/phreox says so; by hand it is worked out from the name)"
        required: false
        default: ""
      sha:
        description: "The commit to build (the workflow of Phreox/phreox gives it; by hand it is the one the ref points to)"
        required: false
        default: ""

permissions:
  contents: read

# A newer push to the branch makes an older run pointless: it would publish a dev release that is replaced at once.
concurrency:
  group: publish-${{ inputs.ref }}
  cancel-in-progress: ${{ inputs.ref_type != 'tag' }}

env:
  RELEASES_REPO: Phreox/releases
  RELEASE: ${{ github.workspace }}/scripts/release.sh

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    outputs:
      sha: ${{ steps.what.outputs.sha }}
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      release: ${{ steps.draft.outputs.id }}
      helpers: ${{ steps.draft.outputs.helpers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What is built: the push that was told about, or the branch or tag that was named by hand.
      - id: what
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
          REF: ${{ inputs.ref }}
          REF_TYPE: ${{ inputs.ref_type }}
          PAYLOAD_SHA: ${{ inputs.sha }}
        run: |
          ref="$REF"
          type="$REF_TYPE"
          sha="$PAYLOAD_SHA"
          [[ -n "$sha" ]] || sha="$(gh api "repos/Phreox/phreox/commits/$ref" --jq .sha)"
          [[ -n "$type" ]] || { [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] && type=tag || type=branch; }
          { echo "ref=$ref"; echo "type=$type"; echo "sha=$sha"; } | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/source
        with:
          sha: ${{ steps.what.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - id: info
        shell: bash
        env:
          REF: ${{ steps.what.outputs.ref }}
        run: |
          if [[ "${{ steps.what.outputs.type }}" == tag ]]; then
            node phreox/phreox-app/scripts/release-info.mjs "$REF" | tee -a "$GITHUB_OUTPUT"
          else
            short="${{ steps.what.outputs.sha }}"
            short="${short:0:8}"
            {
              echo "tag=1.0.0-dev.$short"
              echo "version=1.0.0-dev.$short"
              echo "channel=dev"
              echo "prerelease=true"
            } | tee -a "$GITHUB_OUTPUT"
          fi
      # The draft the whole run puts its files into.
      - id: draft
        shell: bash
        run: |
          notes="Channel: ${{ steps.info.outputs.channel }}
          Built from https://github.com/Phreox/phreox/commit/${{ steps.what.outputs.sha }}"
          id="$("$RELEASE" draft "${{ steps.info.outputs.tag }}" "Phreox ${{ steps.info.outputs.tag }}" "${{ steps.info.outputs.prerelease }}" "$notes")"
          echo "id=$id" | tee -a "$GITHUB_OUTPUT"
          # A second draft that never becomes a release: the builds of libopus and PortAudio go in here for the jobs that need them.
          helpers="$("$RELEASE" draft "helpers-${{ github.run_id }}" "Build helpers of the run ${{ github.run_id }} (thrown away)" true "Not a release.")"
          echo "helpers=$helpers" | tee -a "$GITHUB_OUTPUT"

  # libopus and PortAudio for every platform: without them the sound of a voice channel does not work on Windows and macOS. Their files go into the draft for the jobs that
  # build the backend, and are taken out again before it is published.
  natives:
    needs: plan
    uses: ./.github/workflows/natives.yml
    with:
      sha: ${{ needs.plan.outputs.sha }}
      release: ${{ needs.plan.outputs.helpers }}
    secrets: inherit

  desktop:
    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phreox/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            phreox/phreox-frontend
            phreox/phreox-presence
      - name: System libraries and appimagetool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake nasm pkg-config libfontconfig1-dev libfreetype-dev libasound2-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libdav1d-dev squashfs-tools desktop-file-utils
          # A pinned release of appimagetool (the SHA-256 is the digest GitHub lists for release 1.9.1). The runner has no FUSE, so the tool unpacks itself.
          curl -fsSL -o "$RUNNER_TEMP/appimagetool.AppImage" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          printf '#!/bin/sh\nexec "%s" --appimage-extract-and-run "$@"\n' "$RUNNER_TEMP/appimagetool.AppImage" | sudo tee /usr/local/bin/appimagetool > /dev/null
          sudo chmod +x /usr/local/bin/appimagetool
      - name: libopus and PortAudio of every platform
        continue-on-error: true
        run: |
          mkdir -p phreox-backend/src/main/resources/natives
          for name in $("$RELEASE" names "${{ needs.plan.outputs.helpers }}" 'natives-*.tar.gz'); do
            # A relative name: tar of Windows takes "D:\a\_temp\file" for a file on a computer called D.
            "$RELEASE" download "${{ needs.plan.outputs.helpers }}" "$name" "$name"
            tar -xzf "$name" -C phreox-backend/src/main/resources/natives
            rm "$name"
          done
      - name: Backend jar and the Java runtime that ships with the app
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          bash phreox-frontend/scripts/platform-make-runtime.sh phreox-backend/target/phreox-backend.jar "$RUNNER_TEMP/jre"
      - name: The presence helper
        run: cargo build --release --manifest-path phreox-presence/Cargo.toml
      - name: The app of the channel
        working-directory: phreox/phreox-frontend
        env:
          # The channel, the version and the token are compiled into the app (crates/phreox-platform/build.rs).
          PHREOX_CHANNEL: ${ needs.plan.outputs.channel }
          PHREOX_VERSION: ${ needs.plan.outputs.version }
          PHREOX_UPDATE_TOKEN: ${ secrets.UPDATE_TOKEN }
        run: cargo build --release -p phreox-app
      - name: Package
        run: |
          # libdav1d (the AV1 decoder) is not on every desktop: it goes into the AppImage.
          export EXTRA_LIBS="$(ldd phreox-frontend/target/release/phreox | awk '/libdav1d/ {print $3}')"
          bash phreox-frontend/scripts/platform-package-linux.sh --channel "${{ needs.plan.outputs.channel }}" --version "${{ needs.plan.outputs.version }}" \
            --binary phreox-frontend/target/release/phreox --jar phreox-backend/target/phreox-backend.jar --jre "$RUNNER_TEMP/jre" \
            --presence phreox-presence/target/release/phreox-presence --games phreox-presence/detectable.json \
            --icon phreox-frontend/crates/phreox-platform/assets/phreox-128.png --out "$RUNNER_TEMP/linux"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/linux/phreox-*.AppImage
          "$RELEASE" refresh-checksums "${{ needs.plan.outputs.release }}"


  android:
    needs: plan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web version and the Android app are the React app, which the Rust app does not replace: they are built from its own branch of the frontend repository
      # (the commit in the submodule is the Rust app).
      - name: The React app of the frontend
        run: |
          git -C phreox-frontend fetch --no-tags --depth=1 origin react-legacy
          git -C phreox-frontend checkout --force FETCH_HEAD
          git -C phreox-frontend log --oneline -1
      - name: Make this checkout the app of the channel
        working-directory: phreox/phreox-app
        env:
          PHREOX_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: node scripts/prepare-channel.mjs "${{ needs.plan.outputs.channel }}" "${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - name: Build the web part
        run: |
          (cd phreox-frontend && npm ci)
          (cd phreox-app && npm install --no-audit --no-fund && npm run sync:android)
      - name: Signing key
        id: key
        run: |
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/phreox.jks"
          else
            # Without the shared key the app installs, but cannot be updated over an older build: say so.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK is signed with a throwaway key and cannot update an installed app"
            keytool -genkeypair -keystore "$RUNNER_TEMP/phreox.jks" -storepass throwaway -keypass throwaway -alias phreox -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Phreox CI"
          fi
      - name: APK
        working-directory: phreox/phreox-app/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'throwaway' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'phreox' }}
        run: |
          # The version code grows with every build, so a newer build can always be installed over an older one. The apps were built by the workflow of
          # Phreox/phreox before this repository took over, whose run numbers were below 100000: the numbers of this one start above them.
          ./gradlew --no-daemon assembleRelease \
            -PphreoxApplicationId="$PHREOX_APP_ID" -PphreoxAppName="$PHREOX_APP_NAME" -PphreoxScheme="$PHREOX_SCHEME" \
            -PphreoxVersionName="${{ needs.plan.outputs.version }}" -PphreoxVersionCode="$((100000 + ${{ github.run_number }}))" \
            -PphreoxKeystore="$RUNNER_TEMP/phreox.jks" -PphreoxKeystorePassword="$STORE_PASSWORD" -PphreoxKeyAlias="$KEY_ALIAS"
          mv app/build/outputs/apk/release/app-release.apk \
            "phreox-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}-android-universal.apk"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" phreox-app/android/phreox-*.apk
          "$RELEASE" refresh-checksums "${{ needs.plan.outputs.release }}"


  service:
    needs: plan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phreox/pom.xml
      - name: phreox-service.jar
        run: |
          mvn -B -q -pl phreox-service -am -DskipTests package
          # The Pterodactyl egg and its supervisor take this file: phreox-service-<channel>-<version>.jar
          cp phreox-service/target/phreox-service.jar "$RUNNER_TEMP/phreox-service-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.jar"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/phreox-service-*.jar


  backend:
    needs: [plan, natives]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phreox/pom.xml
      - name: libopus and PortAudio of every platform
        continue-on-error: true
        run: |
          mkdir -p phreox-backend/src/main/resources/natives
          for name in $("$RELEASE" names "${{ needs.plan.outputs.helpers }}" 'natives-*.tar.gz'); do
            # A relative name: tar of Windows takes "D:\a\_temp\file" for a file on a computer called D.
            "$RELEASE" download "${{ needs.plan.outputs.helpers }}" "$name" "$name"
            tar -xzf "$name" -C phreox-backend/src/main/resources/natives
            rm "$name"
          done
      - name: phreox-backend.jar
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          # The Pterodactyl egg "Phreox Backend" takes this file: phreox-backend-<channel>-<version>.jar
          cp phreox-backend/target/phreox-backend.jar "$RUNNER_TEMP/phreox-backend-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.jar"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/phreox-backend-*.jar


  space:
    needs: plan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phreox/pom.xml
      - name: phreox-space.jar
        run: |
          mvn -B -q -pl phreox-space -am -DskipTests package
          cp phreox-space/target/phreox-space.jar "$RUNNER_TEMP/phreox-space-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.jar"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/phreox-space-*.jar


  web:
    needs: plan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web version and the Android app are the React app, which the Rust app does not replace: they are built from its own branch of the frontend repository
      # (the commit in the submodule is the Rust app).
      - name: The React app of the frontend
        run: |
          git -C phreox-frontend fetch --no-tags --depth=1 origin react-legacy
          git -C phreox-frontend checkout --force FETCH_HEAD
          git -C phreox-frontend log --oneline -1
      - name: Build
        env:
          VITE_PHREOX_WEB: "1"
          VITE_PHREOX_CHANNEL: ${{ needs.plan.outputs.channel }}
          VITE_PHREOX_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          (cd phreox-frontend && npm ci && npx vite build)
          mkdir -p "$RUNNER_TEMP/pack"
          cp -r phreox-frontend/dist "$RUNNER_TEMP/pack/site"
          cp pterodactyl/web-server.mjs "$RUNNER_TEMP/pack/server.mjs"
          tar -czf "$RUNNER_TEMP/phreox-web-${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.version }}.tar.gz" -C "$RUNNER_TEMP/pack" .
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/phreox-web-*.tar.gz


  # The installers wait for a runner a long time: the release waits for them, but their failure does not hold it back.
  desktop-win:
    # NOT SWITCHED ON: the Rust app has not been built for Windows anywhere yet (and there is no Electron build any more). Missing, in this order: the AV1 decoder (dav1d has
    # no package on a runner: build it from source or leave AV1 out of this build), a run of this job to find out what else the build needs, and a run of the installer
    # (NSIS with the WinShell plugin). Until it is switched on no Windows file is added to a release, and an installed Windows app is not offered an update.
    needs: [plan, natives]
    if: ${{ false }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phreox/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            phreox/phreox-frontend
            phreox/phreox-presence
      - name: NSIS and its WinShell plugin
        run: |
          choco install nsis -y --no-progress
          curl -fsSL -o "$RUNNER_TEMP/WinShell.zip" https://nsis.sourceforge.io/mediawiki/images/5/54/WinShell.zip
          echo "34e111f8aacf64c540d848fd06b9d6f3e2c10cb825ec9329a01d1141973e749b  $RUNNER_TEMP/WinShell.zip" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/winshell" "$RUNNER_TEMP/WinShell.zip" > /dev/null
          cp "$RUNNER_TEMP/winshell/Plugins/x86-unicode/WinShell.dll" "/c/Program Files (x86)/NSIS/Plugins/x86-unicode/"
          echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
      - name: libopus and PortAudio of every platform
        continue-on-error: true
        run: |
          mkdir -p phreox-backend/src/main/resources/natives
          for name in $("$RELEASE" names "${{ needs.plan.outputs.helpers }}" 'natives-*.tar.gz'); do
            # A relative name: tar of Windows takes "D:\a\_temp\file" for a file on a computer called D.
            "$RELEASE" download "${{ needs.plan.outputs.helpers }}" "$name" "$name"
            tar -xzf "$name" -C phreox-backend/src/main/resources/natives
            rm "$name"
          done
      - name: Backend jar and the Java runtime that ships with the app
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          bash phreox-frontend/scripts/platform-make-runtime.sh phreox-backend/target/phreox-backend.jar "$RUNNER_TEMP/jre"
      - name: The presence helper
        run: cargo build --release --manifest-path phreox-presence/Cargo.toml
      - name: The app of the channel
        working-directory: phreox/phreox-frontend
        env:
          # The channel, the version and the token are compiled into the app (crates/phreox-platform/build.rs).
          PHREOX_CHANNEL: ${ needs.plan.outputs.channel }
          PHREOX_VERSION: ${ needs.plan.outputs.version }
          PHREOX_UPDATE_TOKEN: ${ secrets.UPDATE_TOKEN }
        run: cargo build --release -p phreox-app --no-default-features --features cpu-renderer
      - name: Package
        run: |
          bash phreox-frontend/scripts/platform-package-windows.sh --channel "${{ needs.plan.outputs.channel }}" --version "${{ needs.plan.outputs.version }}" \
            --binary phreox-frontend/target/release/phreox.exe --jar phreox-backend/target/phreox-backend.jar --jre "$RUNNER_TEMP/jre" \
            --presence phreox-presence/target/release/phreox-presence.exe --games phreox-presence/detectable.json --out "$RUNNER_TEMP/win"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/win/phreox-*.exe
          "$RELEASE" refresh-checksums "${{ needs.plan.outputs.release }}"


  desktop-mac:
    # NOT SWITCHED ON, like desktop-win: the Rust app has not been built on macOS yet. Missing: a run of this job (dav1d and nasm come from Homebrew here, but a built app
    # would need them in the bundle or left out), and a start of the bundle on a machine without Homebrew.
    needs: [plan, natives]
    if: ${{ false }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: phreox
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phreox/pom.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            phreox/phreox-frontend
            phreox/phreox-presence
      - name: Build tools
        run: brew install pkg-config nasm dav1d
      - name: libopus and PortAudio of every platform
        continue-on-error: true
        run: |
          mkdir -p phreox-backend/src/main/resources/natives
          for name in $("$RELEASE" names "${{ needs.plan.outputs.helpers }}" 'natives-*.tar.gz'); do
            # A relative name: tar of Windows takes "D:\a\_temp\file" for a file on a computer called D.
            "$RELEASE" download "${{ needs.plan.outputs.helpers }}" "$name" "$name"
            tar -xzf "$name" -C phreox-backend/src/main/resources/natives
            rm "$name"
          done
      - name: Backend jar and the Java runtime that ships with the app
        run: |
          mvn -B -q -pl phreox-backend -am -DskipTests package
          bash phreox-frontend/scripts/platform-make-runtime.sh phreox-backend/target/phreox-backend.jar "$RUNNER_TEMP/jre"
      - name: The presence helper
        run: cargo build --release --manifest-path phreox-presence/Cargo.toml
      - name: The app of the channel
        working-directory: phreox/phreox-frontend
        env:
          # The channel, the version and the token are compiled into the app (crates/phreox-platform/build.rs).
          PHREOX_CHANNEL: ${ needs.plan.outputs.channel }
          PHREOX_VERSION: ${ needs.plan.outputs.version }
          PHREOX_UPDATE_TOKEN: ${ secrets.UPDATE_TOKEN }
        run: cargo build --release -p phreox-app --no-default-features --features cpu-renderer
      - name: Package
        run: |
          bash phreox-frontend/scripts/platform-package-macos.sh --channel "${{ needs.plan.outputs.channel }}" --version "${{ needs.plan.outputs.version }}" \
            --binary phreox-frontend/target/release/phreox --jar phreox-backend/target/phreox-backend.jar --jre "$RUNNER_TEMP/jre" \
            --presence phreox-presence/target/release/phreox-presence --games phreox-presence/detectable.json \
            --icon phreox-frontend/crates/phreox-style/assets/phreox-logo-transparent.png --out "$RUNNER_TEMP/mac"
      - name: Into the release
        run: |
          "$RELEASE" upload "${{ needs.plan.outputs.release }}" "$RUNNER_TEMP"/mac/phreox-*.dmg
          "$RELEASE" refresh-checksums "${{ needs.plan.outputs.release }}"


  # The draft becomes the release as soon as the quick parts are in it. The checksums are written from the digests that GitHub made of the files, and a dev release replaces
  # the one before it. The Android and desktop jobs are not waited for: they add their files to the published release.
  publish:
    needs: [plan, service, backend, space, web]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.service.result == 'success' && needs.backend.result == 'success' && needs.space.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    # A dev release replaces the previous one: only the newest commit may publish, an older run is cancelled by a newer one.
    concurrency:
      group: publish-release-${{ needs.plan.outputs.channel == 'dev' && 'dev' || needs.plan.outputs.tag }}
      cancel-in-progress: ${{ needs.plan.outputs.channel == 'dev' }}
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      ID: ${{ needs.plan.outputs.release }}
      TAG: ${{ needs.plan.outputs.tag }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Checksums
        run: scripts/release.sh refresh-checksums "$ID"
      - name: Only one dev release at a time
        if: needs.plan.outputs.channel == 'dev'
        run: |
          gh release list -R "$RELEASES_REPO" --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E -- '-dev\.[0-9a-f]{8}$' | grep -vx -- "$TAG" \
            | while read -r old; do gh release delete "$old" -R "$RELEASES_REPO" --cleanup-tag --yes; done
      - name: Publish
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then latest=false; else latest=true; fi
          scripts/release.sh publish "$ID" "$PRERELEASE" "$latest"

  # The end of the run: the second draft with the helpers goes, and the draft of a release that was not published goes too (when only a part of the apps is missing, the release
  # stays, as far as it is).
  finish:
    needs: [plan, publish, desktop, android, desktop-win, desktop-mac]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: The helpers are thrown away
        run: scripts/release.sh discard "${{ needs.plan.outputs.helpers }}"
      - name: A release that was not published is thrown away
        if: needs.publish.result != 'success'
        run: scripts/release.sh discard "${{ needs.plan.outputs.release }}"
